/* ---------- glisser-déposer (souris et doigt) ---------- */
let drag=null,suppressClick=false;
const fmtShort=d=>parseISO(d).toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'short'});
function accepts(t){return drag&&((drag.kind==='ev'&&t.dataset.drop==='cell')||(drag.kind==='task'&&t.dataset.drop==='due'))}
document.addEventListener('pointerdown',ev=>{
  if(!canWrite||ev.button>0||drag)return;
  const el=ev.target.closest('[data-drag]');if(!el)return;
  drag={el,kind:el.dataset.drag,id:el.dataset.id,row:el.dataset.row,x:ev.clientX,y:ev.clientY,lx:ev.clientX,ly:ev.clientY,started:false,touch:ev.pointerType!=='mouse',timer:null,over:null};
  if(drag.touch)drag.timer=setTimeout(()=>{if(drag&&!drag.started)startDrag()},300);
});
function startDrag(){
  const r=drag.el.getBoundingClientRect(),g=drag.el.cloneNode(true);
  g.classList.add('drag-ghost');g.removeAttribute('data-act');g.style.width=r.width+'px';
  drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;drag.ghost=g;drag.started=true;
  document.body.appendChild(g);drag.el.classList.add('dragging');document.body.classList.add('is-dragging');
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  moveGhost(drag.lx,drag.ly);
}
function moveGhost(x,y){
  drag.lx=x;drag.ly=y;drag.ghost.style.transform=`translate(${x-drag.dx}px,${y-drag.dy}px) rotate(-1.5deg)`;
  const t=document.elementFromPoint(x,y),d=t&&t.closest('[data-drop]'),ok=d&&accepts(d)?d:null;
  if(drag.over!==ok){drag.over&&drag.over.classList.remove('drop-on');ok&&ok.classList.add('drop-on');drag.over=ok}
  const gw=$('.grid-wrap');if(gw){const r=gw.getBoundingClientRect();if(x<r.left+60)gw.scrollLeft-=14;else if(x>r.right-60)gw.scrollLeft+=14}
  if(y<80)window.scrollBy(0,-14);else if(y>innerHeight-80)window.scrollBy(0,14);
}
document.addEventListener('pointermove',ev=>{
  if(!drag)return;
  if(!drag.started){const dist=Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y);
    if(drag.touch){if(dist>10){clearTimeout(drag.timer);drag=null}return}
    drag.lx=ev.clientX;drag.ly=ev.clientY;if(dist>6)startDrag();return}
  ev.preventDefault();moveGhost(ev.clientX,ev.clientY);
});
document.addEventListener('touchmove',ev=>{if(drag&&drag.started)ev.preventDefault()},{passive:false});
document.addEventListener('contextmenu',ev=>{if(drag)ev.preventDefault()});
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&drag&&drag.started)endDrag(false)});
function endDrag(apply){
  if(!drag)return;clearTimeout(drag.timer);const d=drag;drag=null;if(!d.started)return;
  d.ghost.remove();d.el.classList.remove('dragging');document.body.classList.remove('is-dragging');
  if(d.over){d.over.classList.remove('drop-on');if(apply)dropOn(d,d.over)}
  suppressClick=true;setTimeout(()=>{suppressClick=false},80);
  if(renderPending){renderPending=false;render()}
}
function dropOn(d,t){
  const date=t.dataset.date;
  if(d.kind==='task'){const k=find('tasks',d.id);if(!k||k.due===date)return;const old=k.due;
    patch('tasks',k.id,{due:date});toast(`« ${k.title} » est pour ${fmtShort(date)}`,()=>patch('tasks',k.id,{due:old}));return}
  const e=find('events',d.id);if(!e)return;
  const od=d.el.dataset.date||e.date;
  if(e.repeat){
    const nid=uid(),copy={...body(e),date,repeat:null,skip:[],ex:false};
    if(t.dataset.area&&d.row==='area')copy.area=t.dataset.area;
    if(t.dataset.who&&d.row&&d.row!=='area'&&t.dataset.who!==d.row)copy.who=[...new Set(whoOf(e).map(i=>i===d.row?t.dataset.who:i))];
    if(date===od&&copy.area===e.area&&JSON.stringify(copy.who||null)===JSON.stringify(e.who||null))return;
    const oldSkip=e.skip||[];put('events',nid,copy);patch('events',e.id,{skip:[...oldSkip,od]});
    toast(`« ${e.title} » déplacé au ${fmtShort(date)} pour cette fois`,()=>{del('events',nid);patch('events',e.id,{skip:oldSkip})});return}
  const ch={},undo={};
  if(e.date!==date){ch.date=date;undo.date=e.date}
  if(t.dataset.area&&d.row==='area'&&t.dataset.area!==e.area){ch.area=t.dataset.area;undo.area=e.area}
  if(t.dataset.who&&d.row&&d.row!=='area'&&t.dataset.who!==d.row){const w=whoOf(e);ch.who=[...new Set(w.map(i=>i===d.row?t.dataset.who:i))];undo.who=e.who||[ME]}
  if(!Object.keys(ch).length)return;
  patch('events',e.id,ch);
  const parts=[];if(ch.date)parts.push(fmtShort(ch.date));if(ch.area)parts.push('dans '+area(ch.area).label);if(ch.who)parts.push('pour '+whoTxt(whoOf({who:ch.who})));
  toast(`« ${e.title} » déplacé : ${parts.join(', ')}`,()=>patch('events',e.id,undo));
}


/* ---------- ajout rapide : lecture d'une phrase en français ---------- */
const WD=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MONTHS=['janvier','fevrier','mars','avril','mai','juin','juillet','aout','septembre','octobre','novembre','decembre'];
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’]/g,"'");
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const hm=(h,m)=>(+h>23||+(m||0)>59)?null:pad(+h)+':'+pad(+(m||0));
function nextWeekday(w,strict){const t=new Date(),cur=(t.getDay()+6)%7;let d=(w-cur+7)%7;if(d===0&&strict)d=7;return iso(addDays(t,d))}
function dayWord(w){const x=deacc(w.toLowerCase());if(x==="aujourd'hui")return iso(new Date());if(x==='apres-demain')return iso(addDays(new Date(),2));if(x==='demain')return iso(addDays(new Date(),1));const i=WD.indexOf(x);return i>=0?nextWeekday(i,false):null}
function guessArea(txt,who){
  const x=deacc(txt.toLowerCase()),has=id=>areas().some(a=>a.id===id);
  const rules=[['travail',/\b(kooki|slide|shift|reunion|fournisseur|client|equipe|bureau|magasin|atelier|comptab|livraison|commande|planning|entretien)/],
    ['rdv',/\b(dentiste|medecin|docteur|kine|coiffeur|banque|ophtalmo|pediatre|rdv|rendez-vous|notaire|garage|osteo|dermato|veterinaire)/],
    ['sante',/\b(sport|pilates|yoga|jogging|courir|course a pied|gym|fitness|natation|tennis|velo|salle de sport)/]];
  for(const[id,re]of rules)if(re.test(x)&&has(id))return id;
  if(who.some(i=>i!==ME)&&has('famille'))return 'famille';
  if(/\b(piscine|foot|ecole|creche|anniv|gouter|parents)/.test(x)&&has('famille'))return 'famille';
  return has('perso')?'perso':areas()[areas().length-1].id;
}
function parseFr(raw){
  let t=' '+raw.replace(/\s+/g,' ').trim()+' ';
  const take=re=>{const m=deacc(t).match(re);if(!m)return null;t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);return m};
  const today=new Date();let date=null,start=null,end=null,repeat=null,due=null,kind=null;
  let m=take(/\b(?:toutes les deux semaines|une semaine sur deux)\b/i);if(m)repeat={every:2,until:null};
  const rp=days=>{repeat={every:(repeat&&repeat.every)||1,until:null,days}};
  m=take(/\b(?:tous les jours sauf (?:le |les )?week-?ends?|tous les jours de (?:la )?semaine|en semaine|du lundi au vendredi|chaque jour de (?:la )?semaine|les jours d'ecole|tous les jours d'ecole)\b/i);
  if(m)rp([0,1,2,3,4]);
  else if(take(/\b(?:tous les week-?ends?|chaque week-?end)\b/i))rp([5,6]);
  else if(take(/\b(?:tous les jours|chaque jour)\b/i))rp([0,1,2,3,4,5,6]);
  m=take(/\b(?:tous les|chaque)\s+((?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)s?(?:\s*(?:,|et)\s*(?:le\s+|les\s+)?(?:lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)s?)*)/i);
  if(m)rp([...new Set([...m[1].matchAll(/(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)/gi)].map(x=>WD.indexOf(x[1].toLowerCase())))].sort());
  if(repeat&&repeat.days&&!date)date=repeat.days.map(i=>nextWeekday(i,false)).sort()[0];
  if(take(/\bchaque semaine\b/i))repeat=repeat||{every:1,until:null};
  m=take(/\b(?:avant|pour|d'ici)\s+(?:le\s+|la fin de\s+)?(aujourd'hui|apres-demain|demain|lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/i);
  if(m){due=dayWord(m[1]);kind='task'}
  m=take(/\b(?:de\s+)?(\d{1,2})\s*(?:h|:)\s*(\d{2})?\s*(?:-|a|jusqu'a)\s*(\d{1,2})\s*(?:h|:)?\s*(\d{2})?\b/i);
  if(m){start=hm(m[1],m[2]);end=hm(m[3],m[4])}
  if(!start){m=take(/\b(?:a\s+|vers\s+|des\s+)?(\d{1,2})\s*(?:h|:)\s*(\d{2})?\b/i);if(m)start=hm(m[1],m[2])}
  if(!start&&take(/\b(?:a\s+)?midi\b/i))start='12:00';
  m=take(/\b(ce soir|ce matin|cet apres-midi|cette apres-midi)\b/i);
  if(m){date=date||iso(today);if(!start)start=/soir/.test(m[1])?'19:00':/matin/.test(m[1])?'09:00':'14:00'}
  m=take(/\b(aujourd'hui|apres-demain|demain)\b/i);if(m&&!date)date=dayWord(m[1]);
  m=take(/\b(?:le\s+)?(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?\b/);
  if(m&&!date){let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):today.getFullYear();let d=new Date(y,+m[2]-1,+m[1]);if(!m[3]&&d<addDays(today,-30))d=new Date(y+1,+m[2]-1,+m[1]);date=iso(d)}
  m=take(new RegExp('\\b(?:le\\s+)?(\\d{1,2})(?:er)?\\s+('+MONTHS.join('|')+')\\b','i'));
  if(m&&!date){const y=today.getFullYear();let d=new Date(y,MONTHS.indexOf(m[2].toLowerCase()),+m[1]);if(d<addDays(today,-30))d=new Date(y+1,d.getMonth(),d.getDate());date=iso(d)}
  m=take(/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+prochain)?\b/i);
  if(m&&!date)date=nextWeekday(WD.indexOf(m[1].toLowerCase()),!!m[2]);
  // personnes
  const who=[];let withSomeone=false;
  people().forEach(p=>{const re=new RegExp('(^|[^\\p{L}])(avec\\s+)?'+reEsc(deacc(p.label))+'(?=$|[^\\p{L}])','iu');const mm=deacc(t).match(re);if(mm){who.push(p.id);if(mm[2])withSomeone=true}});
  if(/\b(les enfants|les kids|les petits|les garcons)\b/i.test(deacc(t)))people().filter(p=>p.role==='enfant').forEach(p=>{if(!who.includes(p.id))who.push(p.id)});
  const kidsOnly=who.length&&/\b(tonton|tata|tante|oncle|nounou|mamie|mami|papy|papi|parrain|marraine|baby-?sitter|voisin|voisine)\b/i.test(deacc(t))||helpersList().some(n=>deacc(t).toLowerCase().includes(deacc(n).toLowerCase()));
  if(/\b(avec moi|moi|je|j')\b/i.test(deacc(t))||withSomeone||!who.length||(!kidsOnly&&false))who.unshift(ME);
  // proches qui aident
  const helpers=[];
  helpersList().forEach(n=>{const re=new RegExp('\\b(?:par\\s+|avec\\s+)?'+reEsc(deacc(n))+'\\b','i');if(re.test(deacc(t))){helpers.push(n);take(re)}});
  m=take(/\b(?:par\s+|avec\s+)?(tonton|tata|tante|oncle|nounou|mamie|mami|papy|papi|parrain|marraine|baby-?sitter|voisin|voisine)(\s+[A-Z][\p{L}-]+)?/iu);
  if(m){const n=(m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase()+(m[2]||'')).trim();if(!helpers.some(h=>samePlace(h,n)))helpers.push(n)}
  // lieu
  let place='';
  placesList().forEach(pl=>{if(place)return;const re=new RegExp('\\b(?:a la\\s+|au\\s+|a\\s+|chez\\s+|en\\s+|dans\\s+)?'+reEsc(deacc(pl))+'\\b','i');if(re.test(deacc(t))){place=pl;take(re)}});
  // titre
  let title=t.replace(/\s+/g,' ').trim().replace(/^[\s,.;:–-]+|[\s,.;:–-]+$/g,'').replace(/\s+(a|à|le|la|de|du|pour|et|avec|par|au|chez)$/i,'').replace(/^(le|la|à|a)\s+/i,'').trim();
  if(!title)title=raw.trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  if(!kind)kind=(start||repeat)?'event':'task';
  if(kind==='event'){if(!date)date=iso(today);if(!start)start='09:00';if(!end)end=fromMin(toMin(start)+60)}
  const prio=/\b(urgent|important|vite|asap|absolument)\b/i.test(deacc(raw))?'haute':'moyenne';
  return {kind,title,date,start,end,repeat,who:[...new Set(who)],helpers,place,area:guessArea(raw,who),prio,due:due||(kind==='task'?date:null),src:raw};
}

/* ---------- l'aide de Claude pour les phrases floues ---------- */
let SAMPLE;
async function getSample(){if(SAMPLE!==undefined)return SAMPLE;try{SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){SAMPLE=null}return SAMPLE}
async function askClaude(text){
  const s=await getSample();if(!s||!s.json)return null;
  const td=new Date();
  const prompt=`Tu ranges une note dans l'agenda personnel d'une cheffe d'entreprise belge. Aujourd'hui nous sommes le ${dayLong(td)} (${iso(td)}).
Personnes (id : prénom) : me : ${ownerName()||'la propriétaire'} (la propriétaire de l'agenda)${people().map(p=>`, ${p.id} : ${p.label} (${ROLES[p.role]||'proche'})`).join('')}.
Proches qui aident parfois : ${helpersList().join(', ')||'aucun'}.
Domaines (id : nom) : ${areas().map(a=>`${a.id} : ${a.label}`).join(', ')}.
Lieux connus : ${placesList().join(', ')||'aucun'}.
Note : « ${text} »
Réponds uniquement avec un objet JSON de cette forme :
{"kind":"event ou task","title":"titre court, sans date ni heure","date":"AAAA-MM-JJ ou null","start":"HH:MM ou null","end":"HH:MM ou null","repeatWeeks":0,"repeatDays":[],"who":["ids"],"helpers":["noms"],"place":"lieu ou chaîne vide","area":"id du domaine","prio":"haute, moyenne ou basse","due":"AAAA-MM-JJ ou null"}
Règles : "event" quand il y a un jour et une heure ou un moment précis (rendez-vous, activité) ; sinon "task". repeatWeeks vaut 1 pour « tous les lundis » ou « chaque semaine », 2 pour « une semaine sur deux », sinon 0. repeatDays liste les jours concernés (0 = lundi … 6 = dimanche) : « tous les jours sauf le week-end » donne [0,1,2,3,4], « tous les mardis et jeudis » donne [1,3] ; liste vide si un seul jour, celui de la date. "who" contient "me" si la propriétaire participe ; ne le mets pas si l'activité ne concerne que les enfants ou Abe. "helpers" contient les personnes extérieures qui s'en occupent (tonton, nounou…). Sans heure de fin, compte 1 heure. Une date relative (« mardi », « demain ») se calcule à partir d'aujourd'hui.`;
  try{return await s.json(prompt,{modelTier:'quick'})}catch(e){if(e&&e.code==='not_granted')SAMPLE=null;return null}
}
function mergeAI(base,a){
  if(!a||typeof a!=='object')return base;
  const okD=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v),okT=v=>typeof v==='string'&&/^\d{2}:\d{2}$/.test(v);
  const r={...base,ai:true};
  if(a.kind==='event'||a.kind==='task')r.kind=a.kind;
  if(typeof a.title==='string'&&a.title.trim())r.title=a.title.trim();
  if(okD(a.date))r.date=a.date;if(okT(a.start))r.start=a.start;if(okT(a.end))r.end=a.end;
  if(r.kind==='event'){if(!r.date)r.date=todayISO();if(!r.start)r.start='09:00';if(!r.end||toMin(r.end)<=toMin(r.start))r.end=fromMin(toMin(r.start)+60)}
  r.repeat=(+a.repeatWeeks===1||+a.repeatWeeks===2)?{every:+a.repeatWeeks,until:null}:null;
  if(r.repeat&&Array.isArray(a.repeatDays)){const dd=[...new Set(a.repeatDays.map(Number).filter(n=>n>=0&&n<=6))].sort();if(dd.length)r.repeat.days=dd}
  if(r.repeat&&r.repeat.days&&r.date&&!r.repeat.days.includes(dow(r.date))){let d=parseISO(r.date);for(let i=0;i<7&&!r.repeat.days.includes((d.getDay()+6)%7);i++)d=addDays(d,1);r.date=iso(d)}
  if(Array.isArray(a.who)){const w=a.who.filter(known);if(w.length)r.who=w}
  if(Array.isArray(a.helpers))r.helpers=a.helpers.filter(x=>typeof x==='string'&&x.trim()).map(x=>x.trim());
  if(typeof a.place==='string')r.place=a.place.trim();
  if(areas().some(x=>x.id===a.area))r.area=a.area;
  if(PRIO[a.prio])r.prio=a.prio;
  r.due=okD(a.due)?a.due:(r.kind==='task'?(okD(a.date)?a.date:null):null);
  return r;
}

let QP=null;
function repLabel(rep,date){const days=repDays(rep,date).slice().sort(),k=days.join(''),two=(rep.every||1)===2;
  if(k==='0123456')return two?'tous les jours, une semaine sur deux':'tous les jours';
  if(k==='01234')return (two?'une semaine sur deux, ':'')+'du lundi au vendredi';
  if(k==='56')return (two?'un week-end sur deux':'tous les week-ends');
  return (two?'une semaine sur deux, le ':'chaque ')+joinNames(days.map(i=>WD[i]));}
const repTxt=e=>e.repeat?cap(repLabel(e.repeat,e.date)):'';
function renderPreview(){
  const box=$('#q-preview');if(!box)return;
  if(!QP){box.innerHTML='';box.hidden=true;return}
  box.hidden=false;const q=QP,a=area(q.area),isEv=q.kind==='event';

  chips.push(`<span class="qchip">${avs(q.who)}${esc(whoTxt(q.who))}</span>`);

  box.innerHTML=`<div class="qhead"><div class="seg"><button type="button" class="${isEv?'on':''}" data-act="qkind" data-k="event">Rendez-vous</button><button type="button" class="${!isEv?'on':''}" data-act="qkind" data-k="task">Tâche</button></div>

}
async function quickSubmit(text){
  text=text.trim();if(!text)return;if(!canWrite){toast('Ce carnet est en lecture seule pour vous.');return}
  if(/^\s*(il faut\s+)?(r?acheter|courses?\s*:)\s+/i.test(text)){addShopText(text);QP=null;renderPreview();const i=$('#q-text');if(i)i.value='';return}
  QP={...parseFr(text),aiPending:false};renderPreview();
  const s=await getSample();if(!s||!QP||QP.src!==text)return;
  QP.aiPending=true;renderPreview();

function qpToEvent(q){return {title:q.title,date:q.date,start:q.start,end:q.end,area:q.area,place:q.place||'',note:'',who:q.who,helpers:q.helpers,repeat:q.repeat||null,skip:[],ex:false,at:Date.now()}}
function qpToTask(q){return {title:q.title,area:q.area,who:q.who,helpers:q.helpers,prio:q.prio,due:q.due||null,today:null,done:false,doneAt:null,note:'',ex:false,at:Date.now()}}
function confirmQuick(){

function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;const d=Math.round(h/24);return d===1?'hier':`il y a ${d} jours`}
function addToInbox(text){
  const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);if(!lines.length)return 0;
  lines.forEach((l,i)=>put('inbox',uid(),{text:l,at:Date.now()+i}));return lines.length;
}

const shopLists=()=>(S.config&&S.config.shopLists&&S.config.shopLists.length)?S.config.shopLists:DEFAULT_SHOP_LISTS;

const itemTxt=x=>`${x.qty?x.qty+' ':''}${x.text}`;

/* « 2 l de lait pour Ixelles chez Makro, urgent » → article rangé */
function parseShop(raw,fallbackList){
  let t=' '+raw.trim()+' ',list=null,store=null,urgent=false,askedBy='';
  const x=()=>deacc(t.toLowerCase());
  t=t.replace(/^\s*(il faut\s+)?(r?acheter|courses?\s*:?|prendre)\s+/i,' ');
  const L=[[/\b(pour\s+)?(le\s+|la\s+)?(kooki\s+)?ixelles\b/i,'ixl'],[/\b(pour\s+)?(le\s+|la\s+)?(kooki\s+)?anderlecht\b/i,'and'],[/\b(pour\s+)?(le\s+|la\s+)?slide(\s+coffee)?\b/i,'slide'],[/\b(pour\s+)?(la\s+)?(maison|famille|perso)\b/i,'maison']];
  for(const [re,id] of L){if(re.test(deacc(t))&&shopLists().some(l=>l.id===id)){const m=deacc(t).match(re);t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);list=id;break}}
  if(!list){for(const l of shopLists()){const re=new RegExp('\\b(pour\\s+)?'+reEsc(deacc(l.label.toLowerCase()))+'\\b','i');const m=deacc(t.toLowerCase()).match(re);if(m){t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);list=l.id;break}}}
  if(!list&&/\b(eli|enoah|abe|enfants?|ecole)\b/i.test(x()))list='maison';
  const st=storesKnown().find(s=>new RegExp('\\b(chez|au|a|a la|dans)?\\s*'+reEsc(deacc(s.toLowerCase()))+'\\b','i').test(x()));
  if(st){const re=new RegExp('\\b(chez|au|a|a la|dans)?\\s*'+reEsc(deacc(st.toLowerCase()))+'\\b','i'),m=x().match(re);t=t.slice(0,m.index)+' '+t.slice(m.index+m[0].length);store=st}
  else{const m=t.match(/\s(chez)\s+([^,;]+?)\s*(?=,|;|$)/i);if(m){store=m[2].trim();t=t.replace(m[0],' ')}}
  const ab=t.match(/\s(demand[ée]e?\s+par|de\s+la\s+part\s+de|pour)\s+([A-ZÀ-Ý][\wÀ-ÿ-]+)\s*/);if(ab&&!/^(le|la|les)$/i.test(ab[2])){askedBy=ab[2];t=t.replace(ab[0],' ')}
  if(/\b(urgent|urgence|vite|asap|aujourd'hui)\b/i.test(x())){urgent=true;t=t.replace(/[,;]?\s*\b(urgent|urgence|vite|asap|aujourd'hui|aujourd’hui)\b/ig,' ')}
  t=t.replace(/\s+/g,' ').replace(/^[\s,;:-]+|[\s,;:-]+$/g,'');
  let qty='';const q=t.match(/^((\d+[.,]?\d*)\s*(kg|g|gr|l|cl|ml|x|paquets?|boites?|boîtes?|bouteilles?|sacs?|pieces?|pièces?|cartons?|packs?|rouleaux?|pots?|douzaines?)?)\s+(de\s+|d')?/i);
  if(q){qty=q[1].trim();t=t.slice(q[0].length)}
  t=t.replace(/^(?:(?:du|des|de la|de|un|une|le|la|les)\s+|de l'|d'|l')/i,'');
  return {text:cap(t.trim()),qty,list:list||fallbackList||shopLists()[0].id,store:store||'',urgent,askedBy};
}
function addShopText(raw,fallbackList,extra){
  const p=parseShop(raw,fallbackList);if(!p.text){toast('Écrivez ce qu\'il faut acheter.');return null}
  const id=uid();put('shop',id,{...p,...(extra||{}),due:null,note:'',done:false,doneAt:null,at:Date.now(),ex:false});
  toast(`Ajouté à « ${shopList(p.list).label} » : ${itemTxt(p)}${p.store?' · '+p.store:''}${p.urgent||(extra&&extra.urgent)?' · urgent':''}`,()=>del('shop',id));
  return id;
}

    <div class="field"><label for="se-l">Liste</label><select class="inp" id="se-l">${shopLists().map(l=>`<option value="${l.id}" ${l.id===x.list?'selected':''}>${esc(l.label)}</option>`).join('')}</select></div>
    <div class="field"><label for="se-s">Magasin</label><input class="inp" id="se-s" value="${esc(x.store||'')}" list="se-stores" placeholder="Facultatif"></div>
    <div class="field"><label for="se-d">Pour quand ?</label><input class="inp" type="date" id="se-d" value="${x.due||''}"></div>
    <div class="field"><label for="se-a">Demandé par</label><input class="inp" id="se-a" value="${esc(x.askedBy||'')}" placeholder="Facultatif"></div>
    <div class="field" style="justify-content:flex-end"><label class="checkline"><input type="checkbox" id="se-u" ${x.urgent?'checked':''}> Urgent</label></div>
    <div class="field full"><label for="se-n">Note</label><input class="inp" id="se-n" value="${esc(x.note||'')}" placeholder="Ex. : la marque bleue, pas en promo"></div>
  </div><datalist id="se-stores">${storesKnown().map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
  <footer>${!isNew&&canWrite?`<button type="button" class="btn danger" data-act="shop-del" data-id="${x.id}" style="margin-right:auto">Supprimer</button>`:''}<button type="button" class="btn" data-act="close">Annuler</button>${canWrite?'<button class="btn primary" type="submit">Enregistrer</button>':''}</footer></form>`);
  $('#shForm').dataset.id=x.id||'';
}
function shopText(){
  const f=UI.shopFilter||'all',mode=UI.shopMode||'list',open=openShop().filter(x=>f==='all'||x.list===f).sort(shopSort);
  const line=x=>`- ${itemTxt(x)}${x.urgent?' (urgent)':''}${mode==='store'?` [${shopList(x.list).label}]`:(x.store?` (${x.store})`:'')}`;
  if(mode==='store'){const by={};open.forEach(x=>{(by[x.store||'Autre']=by[x.store||'Autre']||[]).push(x)});return 'Courses\n'+Object.entries(by).map(([k,l])=>`\n${k} :\n${l.map(line).join('\n')}`).join('\n')}
  return 'Courses\n'+shopLists().filter(l=>f==='all'||l.id===f).map(l=>{const it=open.filter(x=>x.list===l.id);return it.length?`\n${l.label} :\n${it.map(line).join('\n')}`:''}).filter(Boolean).join('\n');
}
/* carte sur Aujourd'hui */
function shopCard(){
  const open=openShop();if(!open.length)return '';
  const urg=open.filter(x=>x.urgent),top=[...open].sort(shopSort).slice(0,4);
  return `<section class="panel"><div class="panel-h"><h2>Courses</h2><div class="grow"></div>${urg.length?`<span class="pill bad">${urg.length} urgent${urg.length>1?'s':''}</span>`:''}<span class="pill">${open.length}</span><button class="btn sm" data-act="nav" data-view="shop">Voir les listes</button></div>
    ${top.map(x=>shopRow(x,true)).join('')}${open.length>top.length?`<div class="panel-b muted" style="font-size:13px;padding-top:8px">et ${open.length-top.length} autre${open.length-top.length>1?'s':''}…</div>`:''}</section>`;
}

/* ---------- événements ---------- */
document.addEventListener('click',async ev=>{
  if(typeof suppressClick!=='undefined'&&suppressClick)return;
  const el=ev.target.closest('[data-act]');if(!el)return;const ds=el.dataset;
  switch(ds.act){
    case'shop-new':shopModal({list:UI.shopFilter&&UI.shopFilter!=='all'?UI.shopFilter:shopLists()[0].id});break;
    case'sh-mode':UI.shopMode=ds.m;render();break;
    case'sh-filter':UI.shopFilter=ds.f;if(ds.f!=='all')UI.shopAddList=ds.f;render();break;
    case'sh-list':UI.shopAddList=ds.id;document.querySelectorAll('[data-act="sh-list"]').forEach(b=>{const on=b.dataset.id===ds.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});shPrev();break;
    case'sh-addto':UI.shopAddList=ds.id;render();setTimeout(()=>{const i=$('#sh-text');i&&i.focus()},30);break;
    case'shop-done':{const x=find('shop',ds.id);if(!x)return;patch('shop',x.id,{done:!x.done,doneAt:!x.done?Date.now():null});break}
    case'shop-edit':{const x=find('shop',ds.id);if(x)shopModal(x);break}
    case'shop-del':{const x=find('shop',ds.id);if(!x)return;del('shop',x.id);closeModal();toast(`« ${x.text} » retiré`,()=>put('shop',x.id,body(x)));break}
    case'sh-showdone':UI.shopShowDone=!UI.shopShowDone;render();break;
    case'sh-clear':{const l=S.shop.filter(x=>x.done&&((UI.shopFilter||'all')==='all'||x.list===UI.shopFilter));l.forEach(x=>del('shop',x.id));toast(`${l.length} article${l.length>1?'s':''} retiré${l.length>1?'s':''}`,()=>l.forEach(x=>put('shop',x.id,body(x))));break}
    case'sh-copy':{const t=shopText();try{await navigator.clipboard.writeText(t);toast('Liste copiée : collez-la dans un message.')}
      catch(e){openModal(`<header><h3>Liste de courses</h3><button class="btn ghost" data-act="close" aria-label="Fermer">${icon('x',16)}</button></header><div class="body"><textarea class="inp" style="min-height:260px;font-size:13px" readonly id="sh-txt">${esc(t)}</textarea><div class="muted" style="font-size:12.5px">Sélectionnez le texte et copiez-le.</div></div>`);setTimeout(()=>{const x=$('#sh-txt');x&&x.select()},50)}break}
  }
});
function shPrev(){const i=$('#sh-text'),b=$('#sh-prev');if(!i||!b)return;if(!i.value.trim()){b.textContent='Écrivez comme on vous le demande : la liste, le magasin et « urgent » sont reconnus tout seuls.';return}
  const p=parseShop(i.value,UI.shopAddList||shopLists()[0].id),u=p.urgent||($('#sh-urg')&&$('#sh-urg').checked);
  b.innerHTML=`→ <b>${esc(itemTxt(p))}</b> dans <span class="pill area a${shopList(p.list).c}">${esc(shopList(p.list).label)}</span>${p.store?` <span class="pill">${esc(p.store)}</span>`:''}${u?' <span class="pill bad">Urgent</span>':''}${p.askedBy?` <span class="muted">demandé par ${esc(p.askedBy)}</span>`:''}`}
document.addEventListener('input',ev=>{if(ev.target.id==='sh-text'||ev.target.id==='sh-urg')shPrev()});
document.addEventListener('change',ev=>{if(ev.target.id==='sh-urg'){UI.shopUrgent=ev.target.checked;shPrev()}});
document.addEventListener('submit',ev=>{
  const f=ev.target;
  if(f.id==='shopForm'){ev.preventDefault();const i=$('#sh-text');const v=i.value.trim();if(!v)return;
    const urg=$('#sh-urg').checked;addShopText(v,UI.shopAddList||(UI.shopFilter&&UI.shopFilter!=='all'?UI.shopFilter:shopLists()[0].id),urg?{urgent:true}:null);
    i.value='';shPrev();setTimeout(()=>{const j=$('#sh-text');j&&j.focus()},40);return}
  if(f.id==='shForm'){ev.preventDefault();const id=f.dataset.id||uid(),old=find('shop',id),t=$('#se-t').value.trim();if(!t)return;
    put('shop',id,{...(old?body(old):{done:false,doneAt:null,at:Date.now()}),text:t,qty:$('#se-q').value.trim(),list:$('#se-l').value,store:$('#se-s').value.trim(),due:$('#se-d').value||null,askedBy:$('#se-a').value.trim(),urgent:$('#se-u').checked,note:$('#se-n').value.trim(),ex:false});
    closeModal();toast(old?'Article modifié':'Article ajouté');return}
},true);

/* ---------- réglages : les listes de courses ---------- */
function saveShopLists(list){return S.config?patch('config','main',{shopLists:list}):put('config','main',{name:'',areas:areas(),shopLists:list})}
function shopSettings(){
  return `<section class="panel"><div class="panel-h"><h2>Listes de courses</h2><div class="grow"></div><span class="muted" style="font-size:12.5px">Les canaux d'où arrivent les demandes d'achat</span></div><div class="panel-b">
    ${shopLists().map(l=>`<div class="arow"><input class="inp" id="sl-${l.id}" data-shoplabel="${l.id}" value="${esc(l.label)}" ${canWrite?'':'disabled'} aria-label="Nom de la liste"><div class="swatches">${[1,2,3,4,5,6].map(c=>`<button class="sw a${c} ${l.c===c?'on':''}" data-act="shoplist-color" data-id="${l.id}" data-c="${c}" aria-label="Couleur ${c}" ${canWrite?'':'disabled'}></button>`).join('')}</div>${canWrite&&shopLists().length>1?`<button class="icon-btn" data-act="shoplist-del" data-id="${l.id}" aria-label="Supprimer la liste">${icon('x',16)}</button>`:'<span></span>'}</div>`).join('')}
    ${canWrite?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><input class="inp" style="max-width:280px" id="new-shoplist" placeholder="Nouvelle liste, ex. : Bureau"><button class="btn" data-act="shoplist-add">Ajouter</button></div>`:''}
  </div></section>`;
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const ds=el.dataset;
  if(ds.act==='shoplist-color')saveShopLists(shopLists().map(l=>l.id===ds.id?{...l,c:+ds.c}:l));
  if(ds.act==='shoplist-del'){const n=S.shop.filter(x=>x.list===ds.id&&!x.done).length;if(n){toast(`Cette liste contient encore ${n} article${n>1?'s':''} : achetez-les ou déplacez-les d'abord.`);return}saveShopLists(shopLists().filter(l=>l.id!==ds.id))}
  if(ds.act==='shoplist-add'){const v=$('#new-shoplist').value.trim();if(!v)return;const used=new Set(shopLists().map(l=>l.c));saveShopLists([...shopLists(),{id:'l'+uid(),label:v,c:[1,2,3,4,5,6].find(c=>!used.has(c))||6}])}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.shoplabel){const v=t.value.trim();if(!v)return;saveShopLists(shopLists().map(l=>l.id===t.dataset.shoplabel?{...l,label:v}:l))}});
render();boot();setInterval(tick,30000);setInterval(()=>{if(ready()&&UI.view==='today'&&$('#modal').hidden&&!document.activeElement.matches('input,textarea,select'))render()},60000);
</script>
